schema_version: "1.1"
name: sub-session-needs-new-dependency
expected_outcome: |
  When a sub-session reports it needs a new dependency (e.g. express-rate-limit), the orchestrator pauses that task, presents the choice to the user with options and a recommendation, and only resumes the sub-session via SendMessage after the user answers; it never installs the dependency on the sub-session's say-so.
