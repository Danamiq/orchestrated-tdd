schema_version: "1.1"
name: parallel-feature-two-workstreams
expected_outcome: |
  Orchestrator detects test/lint commands, plans two tasks (HTTP endpoint, CLI) with disjoint file ownership and a shared serializer owned by one task, starts two sub-sessions with start_session (use_worktree, initiation user_asked, contract plus TDD cycle inlined) and waits for their turn-end notes instead of polling, verifies RED/GREEN evidence per task, merges into an integration worktree, runs the full suite there, and asks before merging into the user's branch.
