schema_version: "1.1"
name: parallel-feature-two-workstreams
expected_outcome: |
  Orchestrator detects test/lint commands, plans two tasks (HTTP endpoint, CLI) with disjoint file ownership and a shared serializer owned by one task, spawns worktree-isolated subagents with full task contracts, verifies RED/GREEN evidence per task, merges into an integration worktree, runs the full suite there, and asks before merging into the user's branch.
